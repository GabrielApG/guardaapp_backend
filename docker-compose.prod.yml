# Compose de PRODUÇÃO — usado pelo deploy via GitHub Actions no VPS.
# Diferenças vs. docker-compose.yml (dev):
#   - a API usa a imagem publicada no GHCR (não builda no servidor)
#   - sem MailHog: e-mail vai para um SMTP real configurado no .env
#   - portas de banco/MinIO não expostas ao host por padrão (acesso interno)
#
# O arquivo .env de produção deve existir nesta mesma pasta no VPS.
# A variável API_IMAGE é injetada pelo pipeline (ghcr.io/owner/repo:sha).

services:
  api:
    image: ${API_IMAGE}
    container_name: guardaapp-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      MINIO_ENDPOINT: minio
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - guardaapp-network

  mysql:
    image: mysql:8.0
    container_name: guardaapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_senha}
      MYSQL_DATABASE: ${DB_NAME:-guardaapp}
      MYSQL_USER: ${DB_USER:-guardaapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root_senha}
    ports:
      # Bind SÓ no localhost do VPS — NÃO expõe o MySQL à internet.
      # Acesso externo apenas via túnel SSH:
      #   ssh -i ~/deploy_key -L 3306:127.0.0.1:3306 ubuntu@SEU_IP
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guardaapp-network

  minio:
    image: minio/minio:latest
    container_name: guardaapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # Exposto porque as presigned URLs precisam ser acessíveis externamente.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - guardaapp-network

  minio-init:
    image: minio/mc:latest
    container_name: guardaapp-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/guardaapp-avatars;
      mc mb --ignore-existing local/guardaapp-docs;
      mc mb --ignore-existing local/guardaapp-receipts;
      mc mb --ignore-existing local/guardaapp-milestones;
      mc mb --ignore-existing local/guardaapp-exports;
      exit 0;
      "
    networks:
      - guardaapp-network

volumes:
  mysql_data:
  minio_data:

networks:
  guardaapp-network:
    driver: bridge
