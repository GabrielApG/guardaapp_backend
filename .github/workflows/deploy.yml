name: Deploy Backend

# Dispara em todo push na main. Build da imagem no CI, push para o GHCR
# e deploy via SSH no VPS (docker compose pull + up -d + migrations).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Evita dois deploys simultâneos sobrescrevendo um ao outro.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Normaliza o nome do repositório para minúsculas (exigência do GHCR).
      - name: Definir tag da imagem
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout (para enviar o compose de produção)
        uses: actions/checkout@v4

      # Copia o docker-compose.prod.yml para o servidor.
      - name: Enviar compose de produção
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.DEPLOY_PATH }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Variáveis disponíveis dentro do script remoto.
          envs: API_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Autentica no GHCR para conseguir baixar a imagem privada.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export API_IMAGE="$API_IMAGE"

            # Baixa a nova imagem e sobe os serviços sem downtime desnecessário.
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d

            # Migrations desativadas — rodar manualmente quando necessário:
            # docker compose -f docker-compose.prod.yml run --rm api npm run migrate

            # Remove imagens antigas para não lotar o disco do VPS.
            docker image prune -f
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
